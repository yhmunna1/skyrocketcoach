<style>
    /* Main Container - Zero Outer Padding */
    .sk-iphone-section {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        box-sizing: border-box;
    }

    /* iPhone 17 Pro Max Structure */
    .sk-iphone-wrapper {
        position: relative;
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
    }

    /* Space Black Titanium Frame */
    .sk-iphone-frame {
        position: relative;
        width: 100%;
        padding-top: 205%;
        background: #000000;
        border-radius: 54px;
        border: 10px solid #1c1c1e;
        box-shadow: 0 0 0 2px #2c2c2e, 0 20px 40px rgba(0, 0, 0, 0.4), 0 25px 50px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        box-sizing: border-box;
    }

    /* Status Bar Area */
    .sk-iphone-status-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 48px;
        z-index: 30;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 28px;
        box-sizing: border-box;
        pointer-events: none;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    .sk-status-time {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.2px;
    }

    /* Dynamic Island */
    .sk-iphone-dynamic-island {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 26px;
        background: #000000;
        border-radius: 20px;
        z-index: 35;
        box-shadow: 0 0 2px rgba(255, 255, 255, 0.15);
    }

    /* Right Side Icons */
    .sk-status-icons {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .sk-status-icons svg {
        fill: #ffffff;
        display: block;
    }

    /* Scrollable Screen Viewport */
    .sk-iphone-viewport {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: pointer;
        border-radius: 44px;
    }

    /* Hardware Accelerated Smooth Scroll Image */
    .sk-iphone-img {
        width: 100%;
        height: auto;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        transform: translate3d(0, 0, 0);
        transition: transform 7s cubic-bezier(0.25, 1, 0.5, 1);
        will-change: transform;
        image-rendering: -webkit-optimize-contrast;
        /* Crystal Clear Sharp Image */
    }

    /* GPU Hover Auto-Scroll */
    .sk-iphone-viewport:hover .sk-iphone-img {
        transform: translate3d(0, calc(-100% + 750px), 0);
    }

    /* Lightbox Modal CSS */
    .sk-iphone-lightbox-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        padding: 1.5rem;
        box-sizing: border-box;
    }

    .sk-iphone-lightbox-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .sk-iphone-lightbox-content {
        position: relative;
        max-width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 12px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        background: #fff;
    }

    .sk-iphone-lightbox-content img {
        width: 100%;
        height: auto;
        display: block;
    }

    /* Close Button */
    .sk-iphone-lightbox-close {
        position: fixed;
        top: 25px;
        right: 25px;
        width: 44px;
        height: 44px;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        border-radius: 50%;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
        z-index: 1000000;
    }

    .sk-iphone-lightbox-close:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: scale(1.1);
    }
</style>

<div class="sk-iphone-section">
    <div class="sk-iphone-wrapper">
        <div class="sk-iphone-frame">
            <div class="sk-iphone-status-bar">
                <span class="sk-status-time">9:41</span>
                <div class="sk-iphone-dynamic-island"></div>
                <div class="sk-status-icons">
                    <svg width="16" height="12" viewBox="0 0 18 12">
                        <rect x="0" y="8" width="3" height="4" rx="0.5" />
                        <rect x="5" y="6" width="3" height="6" rx="0.5" />
                        <rect x="10" y="3" width="3" height="9" rx="0.5" />
                        <rect x="15" y="0" width="3" height="12" rx="0.5" />
                    </svg>
                    <svg width="15" height="12" viewBox="0 0 16 12">
                        <path
                            d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM3.5 6.5A6.47 6.47 0 018 4.75c1.72 0 3.29.67 4.5 1.75l1.2-1.2A8.17 8.17 0 008 3a8.17 8.17 0 00-5.7 2.3l1.2 1.2zM.8 3.8A10.87 10.87 0 018 1c2.93 0 5.58 1.15 7.2 3l1.2-1.2A12.57 12.57 0 008 -.5 12.57 12.57 0 00-.4 2.6l1.2 1.2z" />
                    </svg>
                    <svg width="22" height="12" viewBox="0 0 25 12">
                        <rect x="0" y="1" width="21" height="10" rx="3" fill="none" stroke="#ffffff" stroke-width="1" />
                        <rect x="2" y="3" width="13" height="6" rx="1.5" />
                        <path d="M23 4v4" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
                    </svg>
                </div>
            </div>

            <div class="sk-iphone-viewport" id="skIphoneViewport">
                <!-- 🔴 Full High-Resolution Original Image URL -->
                <img src="https://skyrocketcoach.com/wp-content/uploads/2026/08/screencapture-skyrocketcoach-case-study-webinar-funnel-2026-08-23-19_22_29.png"
                    alt="Mobile Fullpage Screenshot" class="sk-iphone-img" id="skIphoneScreenshot" loading="lazy">
            </div>
        </div>
    </div>
</div>

<div class="sk-iphone-lightbox-overlay" id="skIphoneLightbox">
    <button class="sk-iphone-lightbox-close" id="skIphoneLightboxClose" aria-label="Close">&times;</button>
    <div class="sk-iphone-lightbox-content">
        <img src="" id="skIphoneLightboxImg" alt="Full Preview">
    </div>
</div>

<script>
    (function () {
        const viewport = document.getElementById('skIphoneViewport');
        const screenshotImg = document.getElementById('skIphoneScreenshot');
        const lightbox = document.getElementById('skIphoneLightbox');
        const lightboxImg = document.getElementById('skIphoneLightboxImg');
        const closeBtn = document.getElementById('skIphoneLightboxClose');

        viewport.addEventListener('click', function () {
            lightboxImg.src = screenshotImg.src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        function closePopup() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closePopup);

        lightbox.addEventListener('click', function (e) {
            if (e.target === lightbox) {
                closePopup();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closePopup();
            }
        });
    })();
</script>
