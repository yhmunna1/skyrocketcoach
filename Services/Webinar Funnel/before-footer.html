<div class="mec-card-wrapper">
    <div class="mec-card-container" id="mecCardContainer" tabindex="0">
        <!-- Interactive Canvas Layer -->
        <canvas class="mec-canvas" id="mecCanvas"></canvas>


        <!-- Center Content Area -->
        <div class="mec-center-content">
            <div class="mec-inner-flex">
                <div style="position: relative;">
                    <div class="mec-blur-bg-hero"></div>
                    <h2 class="mec-main-title">Ready to build your webinar funnel?</h2>
                </div>
                <div style="position: relative;">
                    <div class="mec-blur-bg-hero"></div>
                    <p class="mec-main-subtitle">Book a free discovery call. We'll talk through what you need and show
                        you how we'd approach it.</p>
                </div>
                <div class="mec-button-group">
                    <a href="https://calendly.com/rhriyad/skyrocketcoach" class="mec-btn mec-btn-primary">Book a free
                        discovery call</a>
                </div>
            </div>
        </div>

        <!-- Footer Text -->
        <div class="mec-footer-text">
            <div style="position: relative;">
                <div class="mec-badge-bg"></div>
                <p class="mec-footer-content">Explore other funnel types: <a
                        href="https://skyrocketcoach.com/lead-generation-funnel/">Lead generation funnel →</a> <a
                        href="https://skyrocketcoach.com/book-funnel/">Book funnel →</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const container = document.getElementById('mecCardContainer');
        const canvas = document.getElementById('mecCanvas');
        if (!container || !canvas) return;

        const ctx = canvas.getContext('2d');
        const dotSpacing = 16;
        const dotSize = 2;
        const repulsionRadius = 80;
        const repulsionStrength = 20;

        let width = 0;
        let height = 0;
        let dots = [];
        let mouse = { x: -9999, y: -9999, targetX: -9999, targetY: -9999 };
        let animationFrameId;

        class Dot {
            constructor(x, y, opacity) {
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                this.baseOpacity = opacity;
                this.currentOpacity = opacity;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = 0.02 + Math.random() * 0.02;
            }

            update(mx, my) {
                // Opacity pulsing animation
                this.phase += this.speed;
                const pulse = (Math.sin(this.phase) + 1) / 2;
                let targetOpacity = this.baseOpacity * (0.5 + pulse * 0.8);

                // Repulsion physics calculation
                let targetX = this.baseX;
                let targetY = this.baseY;

                const dx = this.baseX - mx;
                const dy = this.baseY - my;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < repulsionRadius) {
                    const force = (1 - dist / repulsionRadius) * repulsionStrength;
                    const angle = Math.atan2(dy, dx);
                    targetX = this.baseX + Math.cos(angle) * force;
                    targetY = this.baseY + Math.sin(angle) * force;

                    // Proximity opacity boost
                    const boost = (1 - dist / (repulsionRadius * 1.2)) * 0.8;
                    targetOpacity = Math.min(1, targetOpacity + boost);
                }

                // Smooth movement easing
                this.x += (targetX - this.x) * 0.15;
                this.y += (targetY - this.y) * 0.15;
                this.currentOpacity += (targetOpacity - this.currentOpacity) * 0.15;
            }

            draw(context) {
                context.beginPath();
                context.arc(this.x, this.y, dotSize / 2, 0, Math.PI * 2);
                context.fillStyle = `rgba(161, 161, 170, ${this.currentOpacity})`;
                context.fill();
            }
        }

        function initDots() {
            const rect = container.getBoundingClientRect();
            width = rect.width;
            height = rect.height;

            // Match canvas size to display
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            dots = [];
            const cols = Math.ceil(width / dotSpacing);
            const rows = Math.ceil(height / dotSpacing);
            const centerX = width / 2;
            const centerY = height / 2;
            const maxDistance = Math.sqrt(centerX * centerX + centerY * centerY);

            for (let r = 0; r <= rows; r++) {
                for (let c = 0; c <= cols; c++) {
                    const x = c * dotSpacing;
                    const y = r * dotSpacing;

                    const dx = x - centerX;
                    const dy = y - centerY;
                    const distFromCenter = Math.sqrt(dx * dx + dy * dy);
                    const edgeFactor = Math.min(distFromCenter / (maxDistance * 0.7), 1);

                    if (Math.random() > edgeFactor) continue;

                    const pattern = (r + c) % 3;
                    const baseOpacities = [0.3, 0.5, 0.7];
                    const opacity = baseOpacities[pattern] * edgeFactor;

                    dots.push(new Dot(x, y, opacity));
                }
            }
        }

        function animate() {
            // Smooth lerp mouse coordinates
            mouse.x += (mouse.targetX - mouse.x) * 0.2;
            mouse.y += (mouse.targetY - mouse.y) * 0.2;

            ctx.clearRect(0, 0, width, height);

            dots.forEach(dot => {
                dot.update(mouse.x, mouse.y);
                dot.draw(ctx);
            });

            animationFrameId = requestAnimationFrame(animate);
        }

        // Event Listeners
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouse.targetX = e.clientX - rect.left;
            mouse.targetY = e.clientY - rect.top;
        });

        container.addEventListener('mouseleave', () => {
            mouse.targetX = -9999;
            mouse.targetY = -9999;
        });

        // Resize Observer for Dynamic Responsiveness
        const resizeObserver = new ResizeObserver(() => {
            initDots();
        });
        resizeObserver.observe(container);

        // Initial Trigger
        initDots();
        animate();
    })();
</script>
